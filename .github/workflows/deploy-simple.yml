name: Build and deploy to external Pages repo

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist

    - name: Deploy to aksharrrrr/aksharrrrr.github.io
      uses: peaceiris/actions-gh-pages@v3
      with:
        personal_token: ${{ secrets.GH_PAGES_DEPLOY_TOKEN }}
        external_repository: aksharrrrr/aksharrrrr.github.io
        publish_branch: main
        publish_dir: ./dist
        user_name: github-actions[bot]
        user_email: 41898282+github-actions[bot]@users.noreply.github.com
